name: noosh24
description: >-
  Official Dart client for the Noosh24 Open API, for server-side Dart and
  internal tools only. Never ship a Noosh24 API key inside a Flutter mobile or
  web app.
version: 0.1.0
homepage: https://developer.noosh24.com
repository: https://github.com/noosh24/sdks/tree/main/dart
issue_tracker: https://github.com/noosh24/sdks/issues
documentation: https://developer.noosh24.com/reference
topics:
  - noosh24
  - restaurant
  - pos
  - api
  - sdk

environment:
  sdk: ^3.11.0

platforms:
  linux:
  macos:
  windows:

dependencies:
  http: ^1.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
