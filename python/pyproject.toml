[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "noosh24"
dynamic = ["version"]
description = "Official Python client for the Noosh24 Open API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["noosh24", "restaurant", "pos", "open-api", "sdk", "azerbaijan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
]
dependencies = ["httpx>=0.28.1,<1"]

[project.optional-dependencies]
dev = ["pytest>=9.2", "ruff>=0.17"]

[project.urls]
Homepage = "https://developer.noosh24.com"
Documentation = "https://developer.noosh24.com/reference"
Repository = "https://github.com/noosh24/sdks"
Issues = "https://github.com/noosh24/sdks/issues"

[tool.hatch.version]
path = "src/noosh24/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/noosh24"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/noosh24/__init__.py" = ["F403"]
