name: swift

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["swift/**", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["swift/**", ".github/workflows/swift.yml"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "latest"]
    container: swift:${{ matrix.swift }}
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v7
      - run: swift build -c release
      - run: swift test

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build -c release
      - run: swift test
