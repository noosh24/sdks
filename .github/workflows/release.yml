name: release

on:
  push:
    tags: ["*/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release again, e.g. python/v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      lang: ${{ steps.tag.outputs.lang }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: tag
        run: |
          case "$TAG" in */v*) ;; *) echo "::error::$TAG is not a <folder>/v<version> tag"; exit 1 ;; esac
          lang="${TAG%%/v*}"
          version="${TAG#*/v}"
          python3 tools/version.py "$lang" "$version"
          echo "lang=$lang" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  php:
    needs: meta
    if: needs.meta.outputs.lang == 'php'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - run: composer update --no-interaction --no-progress && vendor/bin/phpunit
        working-directory: php
      - run: tools/github-release.sh "$TAG" "PHP SDK ${{ needs.meta.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

  node:
    needs: meta
    if: needs.meta.outputs.lang == 'node'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
      - run: npm ci && npm run typecheck && npm test && npm run build && npm pack
      - run: tools/github-release.sh "$TAG" "Node.js SDK ${{ needs.meta.outputs.version }}" node/noosh24-open-api-*.tgz
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_NPM == 'true'
        run: |
          if npm view "@noosh24/open-api@${{ needs.meta.outputs.version }}" version > /dev/null 2>&1; then
            echo "@noosh24/open-api@${{ needs.meta.outputs.version }} is already on npm"
            exit 0
          fi
          npm install -g npm@latest > /dev/null
          if ! out=$(npm stage publish --provenance --access public $([[ "$TAG" == *-* ]] && echo --tag next) 2>&1); then
            echo "$out"
            if echo "$out" | grep -qi -E "already (staged|exists)|cannot publish over"; then
              echo "::warning::@noosh24/open-api@${{ needs.meta.outputs.version }} is already staged"
              exit 0
            fi
            exit 1
          fi
          echo "$out"
          echo "::notice::@noosh24/open-api@${{ needs.meta.outputs.version }} is staged on npm. Approve it at npmjs.com or with: npm stage approve <stage-id>"

  python:
    needs: meta
    if: needs.meta.outputs.lang == 'python'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]' build && pytest -W error && python -m build
        working-directory: python
      - run: tools/github-release.sh "$TAG" "Python SDK ${{ needs.meta.outputs.version }}" python/dist/*
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

  dotnet:
    needs: meta
    if: needs.meta.outputs.lang == 'dotnet'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: dotnet test -c Release && dotnet pack src/Noosh24.OpenApi -c Release -o artifacts
        working-directory: dotnet
      - run: tools/github-release.sh "$TAG" ".NET SDK ${{ needs.meta.outputs.version }}" dotnet/artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_NUGET == 'true'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - if: vars.PUBLISH_NUGET == 'true'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: dotnet

  java:
    needs: meta
    if: needs.meta.outputs.lang == 'java'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: ./gradlew --no-daemon build publishMavenPublicationToStagingRepository
        working-directory: java
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - run: cd build/staging-deploy && zip -qr ../central-bundle.zip .
        working-directory: java
      - run: tools/github-release.sh "$TAG" "Java SDK ${{ needs.meta.outputs.version }}" java/build/libs/*.jar
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_MAVEN == 'true'
        run: |
          if curl -fsI "https://repo1.maven.org/maven2/com/noosh24/noosh24-open-api/${{ needs.meta.outputs.version }}/noosh24-open-api-${{ needs.meta.outputs.version }}.pom" > /dev/null 2>&1; then
            echo "noosh24-open-api ${{ needs.meta.outputs.version }} is already on Maven Central"
            exit 0
          fi
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@java/build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=noosh24-open-api-${{ needs.meta.outputs.version }}&publishingType=AUTOMATIC"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

  go:
    needs: meta
    if: needs.meta.outputs.lang == 'go'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go vet ./... && go test -race ./...
        working-directory: go
      - run: tools/github-release.sh "$TAG" "Go SDK ${{ needs.meta.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

  ruby:
    needs: meta
    if: needs.meta.outputs.lang == 'ruby'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rake && gem build noosh24.gemspec
        working-directory: ruby
      - run: tools/github-release.sh "$TAG" "Ruby SDK ${{ needs.meta.outputs.version }}" ruby/noosh24-*.gem
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_RUBYGEMS == 'true'
        run: |
          if curl -fsS "https://rubygems.org/api/v2/rubygems/noosh24/versions/${{ needs.meta.outputs.version }}.json" > /dev/null 2>&1; then
            echo "noosh24 ${{ needs.meta.outputs.version }} is already on RubyGems"
            exit 0
          fi
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          body=$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt} + (if $owner == "" then {} else {owner: $owner} end)')
          response=$(curl -sS -w '\n%{http_code}' -X POST -H "Content-Type: application/json" -d "$body" https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)
          status=$(printf '%s' "$response" | tail -n 1)
          if [ "$status" != "201" ]; then
            echo "::error::RubyGems token exchange answered $status: $(printf '%s' "$response" | sed '$d')"
            exit 1
          fi
          key=$(printf '%s' "$response" | sed '$d' | jq -r .rubygems_api_key)
          echo "::add-mask::$key"
          GEM_HOST_API_KEY="$key" gem push noosh24-*.gem
        working-directory: ruby
        env:
          RUBYGEMS_OWNER: ${{ vars.RUBYGEMS_OWNER }}

  dart:
    needs: meta
    if: needs.meta.outputs.lang == 'dart'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get && dart analyze --fatal-infos && dart test && dart pub publish --dry-run
        working-directory: dart
      - run: tools/github-release.sh "$TAG" "Dart SDK ${{ needs.meta.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_PUB == 'true'
        run: |
          if curl -fsS "https://pub.dev/api/packages/noosh24/versions/${{ needs.meta.outputs.version }}" > /dev/null 2>&1; then
            echo "noosh24 ${{ needs.meta.outputs.version }} is already on pub.dev"
          else
            dart pub publish --force
          fi
        working-directory: dart

  rust:
    needs: meta
    if: needs.meta.outputs.lang == 'rust'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets && cargo package
        working-directory: rust
      - run: tools/github-release.sh "$TAG" "Rust SDK ${{ needs.meta.outputs.version }}" rust/target/package/*.crate
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_CRATES == 'true'
        id: crates
        uses: rust-lang/crates-io-auth-action@v1
      - if: vars.PUBLISH_CRATES == 'true'
        run: |
          if curl -fsS -A "noosh24-release (github.com/noosh24/sdks)" "https://crates.io/api/v1/crates/noosh24/${{ needs.meta.outputs.version }}" > /dev/null 2>&1; then
            echo "noosh24 ${{ needs.meta.outputs.version }} is already on crates.io"
          else
            cargo publish
          fi
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}

  cpp:
    needs: meta
    if: needs.meta.outputs.lang == 'cpp'
    runs-on: ubuntu-latest
    container: gcc:latest
    permissions:
      contents: write
    steps:
      - run: apt-get update -qq && apt-get install -y -qq cmake libcurl4-openssl-dev gh
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j && ctest --test-dir build --output-on-failure
      - run: git archive --format=tar.gz --prefix="noosh24-cpp-${{ needs.meta.outputs.version }}/" -o "noosh24-cpp-${{ needs.meta.outputs.version }}.tar.gz" "$TAG:cpp"
      - run: tools/github-release.sh "$TAG" "C++ SDK ${{ needs.meta.outputs.version }}" noosh24-cpp-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  swift:
    needs: meta
    if: needs.meta.outputs.lang == 'swift'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - run: tools/github-release.sh "$TAG" "Swift SDK ${{ needs.meta.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

  mirror:
    needs: [meta, php, node, python, dotnet, java, go, rust, cpp, ruby, dart, swift]
    if: always() && needs.meta.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    env:
      MIRROR_TOKEN: ${{ secrets.MIRROR_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - if: env.MIRROR_TOKEN == ''
        run: echo "::warning::MIRROR_RELEASE_TOKEN is not set, no release created in noosh24/noosh24-${{ needs.meta.outputs.lang }}"
      - if: env.MIRROR_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.MIRROR_RELEASE_TOKEN }}
          LANG_DIR: ${{ needs.meta.outputs.lang }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          case "$LANG_DIR" in
            php) title="PHP SDK" ;;
            node) title="Node.js SDK" ;;
            python) title="Python SDK" ;;
            dotnet) title=".NET SDK" ;;
            java) title="Java SDK" ;;
            go) title="Go SDK" ;;
            rust) title="Rust SDK" ;;
            cpp) title="C++ SDK" ;;
            ruby) title="Ruby SDK" ;;
            dart) title="Dart SDK" ;;
            swift) title="Swift SDK" ;;
          esac
          tools/mirror-release.sh "$TAG" "noosh24/noosh24-$LANG_DIR" "$title $VERSION"
