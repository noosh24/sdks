name: release

on:
  push:
    tags: ["*/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      lang: ${{ steps.tag.outputs.lang }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: |
          lang="${GITHUB_REF_NAME%%/v*}"
          version="${GITHUB_REF_NAME#*/v}"
          python3 tools/version.py "$lang" "$version"
          echo "lang=$lang" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  php:
    needs: meta
    if: needs.meta.outputs.lang == 'php'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - run: composer update --no-interaction --no-progress && vendor/bin/phpunit
        working-directory: php
      - run: tools/github-release.sh "$GITHUB_REF_NAME" "PHP SDK ${{ needs.meta.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

  node:
    needs: meta
    if: needs.meta.outputs.lang == 'node'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
      - run: npm ci && npm run typecheck && npm test && npm run build && npm pack
      - run: tools/github-release.sh "$GITHUB_REF_NAME" "Node.js SDK ${{ needs.meta.outputs.version }}" node/noosh24-open-api-*.tgz
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_NPM == 'true'
        run: npm publish --provenance --access public $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --tag next)

  python:
    needs: meta
    if: needs.meta.outputs.lang == 'python'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]' build && pytest -W error && python -m build
        working-directory: python
      - run: tools/github-release.sh "$GITHUB_REF_NAME" "Python SDK ${{ needs.meta.outputs.version }}" python/dist/*
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  dotnet:
    needs: meta
    if: needs.meta.outputs.lang == 'dotnet'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: dotnet test -c Release && dotnet pack src/Noosh24.OpenApi -c Release -o artifacts
        working-directory: dotnet
      - run: tools/github-release.sh "$GITHUB_REF_NAME" ".NET SDK ${{ needs.meta.outputs.version }}" dotnet/artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_NUGET == 'true'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - if: vars.PUBLISH_NUGET == 'true'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: dotnet

  java:
    needs: meta
    if: needs.meta.outputs.lang == 'java'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: ./gradlew --no-daemon build publishMavenPublicationToStagingRepository
        working-directory: java
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - run: cd build/staging-deploy && zip -qr ../central-bundle.zip .
        working-directory: java
      - run: tools/github-release.sh "$GITHUB_REF_NAME" "Java SDK ${{ needs.meta.outputs.version }}" java/build/libs/*.jar
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_MAVEN == 'true'
        run: |
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@java/build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=noosh24-open-api-${{ needs.meta.outputs.version }}&publishingType=AUTOMATIC"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

  go:
    needs: meta
    if: needs.meta.outputs.lang == 'go'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go vet ./... && go test -race ./...
        working-directory: go
      - run: tools/github-release.sh "$GITHUB_REF_NAME" "Go SDK ${{ needs.meta.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

  ruby:
    needs: meta
    if: needs.meta.outputs.lang == 'ruby'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rake && gem build noosh24.gemspec
        working-directory: ruby
      - run: tools/github-release.sh "$GITHUB_REF_NAME" "Ruby SDK ${{ needs.meta.outputs.version }}" ruby/noosh24-*.gem
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_RUBYGEMS == 'true'
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - if: vars.PUBLISH_RUBYGEMS == 'true'
        run: gem push noosh24-*.gem
        working-directory: ruby

  dart:
    needs: meta
    if: needs.meta.outputs.lang == 'dart'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get && dart analyze --fatal-infos && dart test && dart pub publish --dry-run
        working-directory: dart
      - run: tools/github-release.sh "$GITHUB_REF_NAME" "Dart SDK ${{ needs.meta.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_PUB == 'true'
        run: dart pub publish --force
        working-directory: dart

  rust:
    needs: meta
    if: needs.meta.outputs.lang == 'rust'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets && cargo package
        working-directory: rust
      - run: tools/github-release.sh "$GITHUB_REF_NAME" "Rust SDK ${{ needs.meta.outputs.version }}" rust/target/package/*.crate
        env:
          GH_TOKEN: ${{ github.token }}
      - if: vars.PUBLISH_CRATES == 'true'
        id: crates
        uses: rust-lang/crates-io-auth-action@v1
      - if: vars.PUBLISH_CRATES == 'true'
        run: cargo publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}

  cpp:
    needs: meta
    if: needs.meta.outputs.lang == 'cpp'
    runs-on: ubuntu-latest
    container: gcc:latest
    permissions:
      contents: write
    steps:
      - run: apt-get update -qq && apt-get install -y -qq cmake libcurl4-openssl-dev gh
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j && ctest --test-dir build --output-on-failure
      - run: git archive --format=tar.gz --prefix="noosh24-cpp-${{ needs.meta.outputs.version }}/" -o "noosh24-cpp-${{ needs.meta.outputs.version }}.tar.gz" "$GITHUB_REF_NAME:cpp"
      - run: tools/github-release.sh "$GITHUB_REF_NAME" "C++ SDK ${{ needs.meta.outputs.version }}" noosh24-cpp-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  swift:
    needs: meta
    if: needs.meta.outputs.lang == 'swift'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: tools/github-release.sh "$GITHUB_REF_NAME" "Swift SDK ${{ needs.meta.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

  mirror:
    needs: [meta, php, node, python, dotnet, java, go, rust, cpp, ruby, dart, swift]
    if: always() && needs.meta.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    env:
      MIRROR_TOKEN: ${{ secrets.MIRROR_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - if: env.MIRROR_TOKEN == ''
        run: echo "::warning::MIRROR_RELEASE_TOKEN is not set, no release created in noosh24/noosh24-${{ needs.meta.outputs.lang }}"
      - if: env.MIRROR_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.MIRROR_RELEASE_TOKEN }}
          LANG_DIR: ${{ needs.meta.outputs.lang }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          case "$LANG_DIR" in
            php) title="PHP SDK" ;;
            node) title="Node.js SDK" ;;
            python) title="Python SDK" ;;
            dotnet) title=".NET SDK" ;;
            java) title="Java SDK" ;;
            go) title="Go SDK" ;;
            rust) title="Rust SDK" ;;
            cpp) title="C++ SDK" ;;
            ruby) title="Ruby SDK" ;;
            dart) title="Dart SDK" ;;
            swift) title="Swift SDK" ;;
          esac
          tools/mirror-release.sh "$GITHUB_REF_NAME" "noosh24/noosh24-$LANG_DIR" "$title $VERSION"
