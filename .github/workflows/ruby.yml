name: ruby

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ruby/**", ".github/workflows/ruby.yml"]
  pull_request:
    paths: ["ruby/**", ".github/workflows/ruby.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0"]
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rake
      - run: gem build noosh24.gemspec
